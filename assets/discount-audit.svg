<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760">
<rect width="1120" height="760" fill="#101827"/>
<style>text{font-family:Arial,sans-serif;fill:#e7edf8}</style>
<metadata data-encoding="zlib+base64"></metadata>
<text x="30" y="44" font-size="26" style="fill:#e7edf8" >ErgodLab | a discounted gradient proxy need not be a gradient</text>
<text x="30" y="82" font-size="18" style="fill:#e7edf8" >Exact two-state, two-parameter counterexample. Both policies and transitions are known.</text>
<text x="30" y="126" font-size="21" style="fill:#63d8bc" >Average-reward gradient: [1/18, -1/18]. Fixed starting state: 0.</text>
<text x="30" y="163" font-size="17" style="fill:#b7c4d9" >The stationary proxy and true normalized discounted-objective gradient are different quantities.</text>
<text x="42" y="220" font-size="18" style="fill:#e7edf8" >Discount beta</text>
<text x="170" y="220" font-size="18" style="fill:#e7edf8" >Stationary proxy vector</text>
<text x="465" y="220" font-size="18" style="fill:#e7edf8" >Fixed-start gradient vector</text>
<text x="820" y="220" font-size="18" style="fill:#e7edf8" >Proxy curl[0][1]</text>
<path d="M 30 238 H 1090" stroke="#33445e"/>
<text x="42" y="269" font-size="19" style="fill:#e7edf8" data-row="0" data-col="0">0</text>
<text x="170" y="269" font-size="19" style="fill:#e7edf8" data-row="0" data-col="1">[1/24, -1/24]</text>
<text x="465" y="269" font-size="19" style="fill:#e7edf8" data-row="0" data-col="2">[0, 0]</text>
<text x="820" y="269" font-size="19" style="fill:#e9bb79" data-row="0" data-col="3">-1/96</text>
<path d="M 30 294 H 1090" stroke="#33445e"/>
<text x="42" y="325" font-size="19" style="fill:#e7edf8" data-row="1" data-col="0">1/2</text>
<text x="170" y="325" font-size="19" style="fill:#e7edf8" data-row="1" data-col="1">[1/21, -1/21]</text>
<text x="465" y="325" font-size="19" style="fill:#e7edf8" data-row="1" data-col="2">[5/98, -1/98]</text>
<text x="820" y="325" font-size="19" style="fill:#e9bb79" data-row="1" data-col="3">-1/147</text>
<path d="M 30 350 H 1090" stroke="#33445e"/>
<text x="42" y="381" font-size="19" style="fill:#e7edf8" data-row="2" data-col="0">9/10</text>
<text x="170" y="381" font-size="19" style="fill:#e7edf8" data-row="2" data-col="1">[5/93, -5/93]</text>
<text x="465" y="381" font-size="19" style="fill:#e7edf8" data-row="2" data-col="2">[117/1922, -81/1922]</text>
<text x="820" y="381" font-size="19" style="fill:#e9bb79" data-row="2" data-col="3">-5/2883</text>
<path d="M 30 406 H 1090" stroke="#33445e"/>
<text x="42" y="437" font-size="19" style="fill:#e7edf8" data-row="3" data-col="0">99/100</text>
<text x="170" y="437" font-size="19" style="fill:#e7edf8" data-row="3" data-col="1">[50/903, -50/903]</text>
<text x="465" y="437" font-size="19" style="fill:#e7edf8" data-row="3" data-col="2">[10197/181202, -9801/181202]</text>
<text x="820" y="437" font-size="19" style="fill:#e9bb79" data-row="3" data-col="3">-50/271803</text>
<path d="M 30 462 H 1090" stroke="#33445e"/>
<text x="42" y="493" font-size="19" style="fill:#63d8bc" data-row="4" data-col="0">1 (limit)</text>
<text x="170" y="493" font-size="19" style="fill:#63d8bc" data-row="4" data-col="1">[1/18, -1/18]</text>
<text x="465" y="493" font-size="19" style="fill:#63d8bc" data-row="4" data-col="2">[1/18, -1/18]</text>
<text x="820" y="493" font-size="19" style="fill:#63d8bc" data-row="4" data-col="3">0</text>
<text x="30" y="555" font-size="20" style="fill:#e9bb79" >At beta = 1/2, curl[0][1] = -1/147. A nonzero curl rules out a local scalar potential.</text>
<text x="30" y="592" font-size="17" style="fill:#e7edf8" >Curl[i][j] = derivative_i(proxy_j) - derivative_j(proxy_i); it is not a full Jacobian.</text>
<text x="30" y="628" font-size="18" style="fill:#e7edf8" >True objective: (1-beta) E_start[sum beta^t R_t]. The initial state is held fixed.</text>
<text x="30" y="664" font-size="17" style="fill:#e7edf8" >At beta = 1, the row is the average-reward / centered-Poisson limit, not a discounted inverse.</text>
<text x="30" y="702" font-size="16" style="fill:#b7c4d9" >Zero curl alone does not prove a field is a gradient. No sampled estimator, optimizer or training claim.</text>
<text x="30" y="740" font-size="16" style="fill:#b7c4d9" >Every table entry and the full exact resolvent/derivative/residual audit are embedded in SVG metadata.</text>
</svg>
