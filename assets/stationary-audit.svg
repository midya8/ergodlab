<text x="30.00000000" y="44.00000000" font-size="27" style="fill:#e7edf8">ErgodLab | the one-step reward misses the long run</text>
<text x="30.00000000" y="82.00000000" font-size="18" style="fill:#e7edf8">Exact stationary policy gradients and Markov-additive reward variance. No sampling.</text>
<text x="40.00000000" y="131.00000000" font-size="21" style="fill:#e7edf8">Equal one-step variance, different temporal dependence</text>
<text x="40.00000000" y="163.00000000" font-size="17" style="fill:#b7c4d9">Stationary Var(reward) = 1/4 in both two-state chains. State rewards: 0 and 1.</text>
<text x="40.00000000" y="197.00000000" font-size="16" style="fill:#b7c4d9">Vertical: Var(sum of N rewards) / N. Horizontal: block length N.</text>
