<text x="725.00000000" y="244.00000000" font-size="21" style="fill:#e9bb79">Sticky chain</text>
<text x="725.00000000" y="277.00000000" font-size="18" style="fill:#e7edf8">P(stay) = 7/8</text>
<text x="725.00000000" y="310.00000000" font-size="18" style="fill:#e7edf8">Asymptotic variance = 7/4</text>
<text x="725.00000000" y="365.00000000" font-size="21" style="fill:#63d8bc">Alternating chain</text>
<text x="725.00000000" y="398.00000000" font-size="18" style="fill:#e7edf8">P(switch) = 1; period = 2</text>
<text x="725.00000000" y="431.00000000" font-size="18" style="fill:#e7edf8">Asymptotic variance = 0</text>
<text x="725.00000000" y="484.00000000" font-size="16" style="fill:#b7c4d9">Dashed lines are exact limits.</text>
<text x="725.00000000" y="514.00000000" font-size="16" style="fill:#b7c4d9">Not mixing-rate or CLT claims.</text>
<text x="30.00000000" y="571.00000000" font-size="21" style="fill:#e7edf8">A policy changes which states it visits, even when immediate rewards do not change</text>
<text x="30.00000000" y="608.00000000" font-size="17" style="fill:#e7edf8">Separate occupancy fixture: stationary distribution = [1/3, 2/3]; mean reward = 2/3.</text>
<text x="30.00000000" y="641.00000000" font-size="21" style="fill:#63d8bc">Frozen-occupancy gradient: 0. True average-reward gradient: 1/18.</text>
<text x="30.00000000" y="676.00000000" font-size="17" style="fill:#e7edf8">Stationary linear-system derivatives = directed spanning-tree derivatives = Poisson-bias gradient.</text>
<text x="30.00000000" y="710.00000000" font-size="16" style="fill:#b7c4d9">Supplied finite irreducible chains only. Reward-sum variance is not policy-gradient estimator variance.</text>
<text x="30.00000000" y="744.00000000" font-size="16" style="fill:#b7c4d9">Complete exact audit JSON is embedded in compressed SVG metadata; displayed lines are not simulations.</text>
